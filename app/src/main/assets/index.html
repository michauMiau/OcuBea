<!DOCTYPE html>
<html lang="en" data-default-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="ocubea-build" content="17693770">
<title>OcuBea</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<!-- No query string on the icon, deliberately. A build-id query here means a
     browser treats every build as a brand new URL, so the favicon can never be
     served from cache and the entry grows one dead URL per build. Changing the
     icon then means editing the file, which is the point: the icon is part of
     the app, not a build artefact, and it should look the same on every
     install. Cache-Control on the response is what bounds a stale copy. -->
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --line: #30363d;
  --txt: #e6edf3;
  --dim: #8b949e;
  --acc: #4caf50;
  --warn: #ff5252;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: var(--bg);
  color: var(--txt);
  font:
    14px/1.5 -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Roboto,
    sans-serif;
  padding-bottom: 40px;
}
/* The top strip: the title row and the status row inside ONE sticky block.
   They were two siblings each with position:sticky;top:0, so whichever came
   second painted over the first the moment the page scrolled, and the
   complaint from the phone was that the top bar wastes all this space.
   One wrapper means one bar. It is taller than the old header because the
   status moved out of the page body and into it. */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(13, 17, 23, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 4px;
}
h1 {
  font-size: 16px;
  color: var(--acc);
  font-weight: 700;
}
.pill {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 9px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--dim);
}
.pill.on {
  color: var(--acc);
  border-color: var(--acc);
}
.pill.off {
  color: var(--warn);
  border-color: var(--warn);
}
/* the status bar: above the picture, not under it. The values were a <dl> in a
   full section further down the page, so the two things the user checks most
   often, is it live and is the encoder keeping up, were below the fold and
   under the video. Same dt/dd pairs, one wrapping row, one border, inside the
   sticky top bar so it is on screen at every scroll position. */
.statusbar {
  padding: 0 12px 6px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 5px;
  margin: 0;
}
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 2px 7px;
  background: #0d1117;
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
/* The dt above its dd, not beside it.
 *
 * The user read the two-column chip as two separate bars: a thin strip of
 * labels and a separate strip of numbers, both full width, with a gap between
 * them. That is what `display:inline-flex` with `align-items:baseline` produces
 * when the flex row wraps -- the eight pairs do not fit one line at phone
 * width, so dt and dd split into two rows and the bar reads as two bars.
 *
 * A column puts the label above its own value and lets the wrap happen between
 * chips, which is the only place a wrap is harmless. `align-items:stretch`
 * with an explicit gap makes every chip the same height even when one value is
 * two lines (the encoder name), so the bar stays one bar.
 */
.chip {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 3px 8px;
  text-align: center;
}
.chip dt {
  font-size: 9px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--dim);
  white-space: nowrap;
  line-height: 1.15;
}
/* The encoder name is the one value long enough to matter, c2.android.avc
   encoder, so this chip wraps rather than clips. A clipped value is a value the
   user cannot read, and layout_verify reports an overflowed dd as a layout
   failure. */
.chip dd {
  margin: 0;
  font-size: 12px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  overflow: visible;
  text-align: center;
}
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 10px;
}
/* The picture and the audio control are ONE box. The audio toggle used to live
   in a section of its own further down, under the security panel, so the sound
   control for this stream was three screens away from the stream it controls.
   .stage welds the strip to the picture's bottom edge: shared border radius, no
   gap, one border between them. */
.stage {
  margin-bottom: 8px;
}
.stream {
  position: relative;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 9px 10px 0 0;
  overflow: hidden;
}
.stage > .audio-row {
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 10px 10px;
  background: var(--panel);
  margin: 0;
  padding: 5px 8px;
  gap: 8px;
}
.stage > .audio-row .dim {
  margin: 0;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.stream img {
  width: 100%;
  display: block;
  aspect-ratio: 16/9;
  object-fit: contain;
}
/* The HLS <video> had NO rule here while the <img> above did, so switching
   between MJPEG and HLS changed the height of the picture box: the img is
   pinned to 16/9 and the video was left to the browser's default intrinsic
   ratio. The user saw the layout jump the moment HLS switched on. Same four
   declarations as the img, on both elements. */
.stream video {
  width: 100%;
  display: block;
  aspect-ratio: 16/9;
  object-fit: contain;
}
.stream .off {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
  font-size: 14px;
}
/* Shown when HLS was switched off automatically, so the picture that appeared
     is explained rather than looking like the user's own mode change. */
.stream .badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(22, 27, 34, 0.82);
  color: var(--dim);
  font-size: 11px;
  border: 1px solid #30363d;
}
.grid {
  display: grid;
  gap: 12px;
}
.g2 {
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}
.g4 {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
/* An action the phone refused. Without it a failed control is indistinguishable
     from one that worked, because most endpoints answer 200 "ok" either way. */
.flash {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: #3d1d1d;
  border: 1px solid var(--warn);
  color: #ffb4b4;
  font-size: 13px;
}
.dim {
  color: var(--dim);
  font-size: 12px;
  margin-top: 8px;
}
/* A filename in a list row. truncate + min-width:0 so one long name clips
     instead of stretching the row past the viewport. */
.row .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: ui-monospace, monospace;
  font-size: 12px;
}
.row .val {
  color: var(--dim);
  font-family: ui-monospace, monospace;
  font-size: 13px;
}
.text {
  flex: 1;
  min-width: 0;
  background: #0d1117;
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font:
    12px ui-monospace,
    monospace;
  font-family: inherit;
}
/* margin-left:auto, unlike .pill: the pills push the language button right,
     so it must not push itself off the row. */
.lang {
  margin-left: auto;
  padding: 4px 10px;
  font-size: 11px;
  letter-spacing: 0.06em;
}
/* min-width:0: this is a grid item, and a grid/flex child refuses to shrink
     below its content width without it -- a section holding a long value
     widened the whole column instead of clipping. */
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
  margin-bottom: 8px;
  min-width: 0;
}
/* A section that exists only to list files gets its own identity: the file
     lists are the tallest thing on the page, and at full height they pushed
     every control below the fold. Capped and scrolled, with the cap removed
     once a preview is open. */
section.files {
  max-height: 320px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
section.files:has(.preview-open) {
  max-height: none;
}
h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
  margin-bottom: 8px;
  font-weight: 600;
}
/* A hairline under the heading separates it from the rows without adding
     another box: the section already has a border, and a second one reads as
     a nested card. */
h2 {
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
/* ── file rows ──────────────────────────────────────────────────────────
     A grid, not a flex row. With flex the size, the download link and the
     delete button all got their own flex basis, so their left edges moved
     with the length of the filename and the columns visibly jumped from row
     to row. Fixed tracks keep every column on one vertical line; only the
     name is allowed to give width back. */
.row.file {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 8px;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px solid #21262d;
}
.row.file:last-child {
  border-bottom: 0;
}
.row.file .name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* A clip name opens the preview, so it needs the affordance of something
     clickable. Underline on hover only: an always-underlined column of
     filenames reads as a wall of links. */
.row.file .name[onclick] {
  cursor: pointer;
}
.row.file .name[onclick]:hover {
  color: #58a6ff;
  text-decoration: underline;
}
.row.file .size {
  font-size: 12px;
  color: var(--dim);
  font-family: ui-monospace, monospace;
  text-align: right;
  min-width: 64px;
}
/* Icon-width buttons with a real border: the bare "↓" and "✕" read as
     decoration rather than as controls, and sat too close to the name. */
.row.file .ctl {
  flex: none;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 14px;
}
button {
  background: #21262d;
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: 0.15s;
  font-family: inherit;
}
button:hover {
  background: #30363d;
}
/* One button language. Every button gets the same height and the same
     neutral surface, so a "danger" one is the only thing that reads as
     different -- before, the red fill was one of five looks on the page and
     carried no meaning. */
button.ctl {
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  white-space: nowrap;
}
button.primary {
  background: #238636;
  border-color: #2ea043;
  color: #fff;
}
button.primary:hover {
  background: #2ea043;
}
button.danger {
  background: transparent;
  border-color: #6e2b2b;
  color: #ff8a80;
}
button.danger:hover {
  background: #3d1d1d;
}
/* A disabled bulk action has to LOOK disabled. The three "delete all" /
     "apply limits" buttons walk the list client-side, so on an empty list they
     send nothing at all -- without this they were indistinguishable from a
     working control, which is the failure the undefined helpers had. */
/* A dropped-frame count and a clip error are the two numbers on this page that
     mean something is wrong; they must not read like the values beside them. */
.warn {
  color: #ffb454;
}
button.ctl:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
button.ctl:disabled:hover {
  background: inherit;
  border-color: var(--line);
}
button.primary:disabled:hover {
  background: #238636;
}
button.danger:disabled:hover {
  background: transparent;
}
/* The download link is a control, not text: same box as the buttons beside
     it, arrow centred. */
a.ctl {
  height: 36px;
  min-width: 32px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #21262d;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--txt);
  text-decoration: none;
  font-size: 14px;
}
a.ctl:hover {
  background: #30363d;
}
/* The HLS quality readout sits in the big-button row as a read-only box: it
     gets the same height and the same 44% track as the buttons, so the row has
     one rhythm, and it may give width back. */
/* padding 0 6px and no nowrap: at 360px the track is 92px and "Jakość HLS: wył."
     needs 96px at 13px, so it was being clipped. The label wraps to two lines
     inside a 44px box instead, which is why the box is 44px tall. */
.row > .badge {
  flex: 1 1 30%;
  min-width: 0;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  font-size: 13px;
  line-height: 1.2;
  text-align: center;
  white-space: normal;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--dim);
}
/* Definition lists carry the read-only values. A dimmer, smaller term and a
     value on the same line give the numbers a column to align in, instead of
     every pair starting at the left edge with nothing holding it together. */
dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  align-items: baseline;
}
dt {
  color: var(--dim);
  font-size: 12px;
}
dd {
  text-align: right;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
button.on {
  background: #238636;
  border-color: #2ea043;
  color: #fff;
}
/* ── the big action buttons ──────────────────────────────────────────────
     They sat as bare <button class="big"> children of <section>, so the
     section's display:block stacked them one per line with the flex `gap`
     doing nothing. The complaint was that elements look flattened and overlap
     the grid: the real cause was no row, so no gap and no wrapping control.
     A row with a gap, and buttons that grow to share the line evenly. */
button.big {
  flex: 1 1 30%;
  min-width: 0;
  height: 44px;
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  text-align: center;
  line-height: 1.2;
  white-space: normal;
  overflow: hidden;
}
/* Secondary actions in the same bar read lighter than start/stop but keep
     the same box, so the bar has one rhythm. */
button.big.secondary {
  background: transparent;
  color: var(--dim);
}
button.big.secondary:hover {
  background: #21262d;
  color: var(--txt);
}
/* start and stop keep their distinct colours but the same width as every
     other button in the bar, so the row reads as one grid rather than two fat
     buttons above four small ones. */
button.big.primary-weight {
  flex: 1 1 30%;
}
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.row.tight {
  gap: 6px;
}
/* Every child flexes and can shrink below its content width. Without
     min-width:0 a flex child refuses to shrink at all, so the slider and its
     readout pushed the row past the viewport on a 360px screen; the label
     needs a smaller floor than the controls so it wraps first. */
.row > * {
  flex: 1;
  min-width: 0;
}
.row > span:first-child {
  flex: 0 1 auto;
  min-width: 70px;
  max-width: 45%;
}
/* A .ctl holding a slider and its readout is two items, not one: the
     input at width:100% consumed the whole track and the readout next to it
     was laid out at clientWidth 0, which layout_verify reports as an
     overflowing span. */
.row .ctl {
  flex: 1 1 120px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.row input[type='range'] {
  flex: 1 1 auto;
  min-width: 0;
  /* The user called these "excessively wide" and the measurement agrees:
     at a 1280px viewport inside an 860px `main` they rendered 693-716px
     wide, so the track occupied 82% of the content column and a 1px change
     needed a mouse drag across most of the screen. Capping it keeps the drag
     proportional to the precision the setting actually has -- JPEG quality
     moves in steps of 1 across 40..100, so a 560px track is already finer
     than the hand can aim. `max-width` rather than a fixed one, so a narrow
     window still shrinks the track instead of overflowing. */
  max-width: 340px;
}
/* The numeric readout next to a slider was a plain <span>, so it could only be
   read. Making it a number input puts the cursor in it on click, which is what
   "no numeric input when hovering over the number" asked for: type 82 and the
   encoder gets 82 instead of a drag that happens to land near it. 74px fits
   four digits at the 13px field font with the existing padding, so nothing is
   cut when the setting reaches 1000 (segment length does). */
.row input[type='number'].num {
  flex: 0 0 74px;
  width: 74px;
  padding: 5px 6px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
/* Optics: sliders and selects on one side, the icon tiles on the other.
 *
 * The user asked for this twice. The first attempt capped the sliders at 340px
 * and left both groups stacked, which is the thing they explicitly did not want
 * -- a shorter slider is not a side-by-side layout.
 *
 * `minmax(0, 1.15fr)` on the control column rather than `1fr`: the selects carry
 * option text that must not be truncated, and a 1fr track clips them first at
 * narrow widths. The tile column is content-sized (`auto`) so three tiles take
 * only what their captions need instead of half the row.
 *
 * Below 720px the grid drops to one column and the tiles move under the
 * controls. Two columns at phone width put each slider at ~150px, which is
 * shorter than the tap target for a one-step change.
 */
section.split {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) auto;
  gap: 8px 14px;
  align-items: start;
}
section.split h2.span2 {
  grid-column: 1 / -1;
}
/* The tile column is its own grid so it can stay 3 tracks wide no matter how
   narrow the control column becomes; `grid-column: 2` pins it right of the
   sliders instead of letting auto-placement find a free cell below. */
section.split .col-tiles {
  grid-column: 2;
  grid-row: 2;
  display: grid;
  grid-template-columns: repeat(3, minmax(84px, max-content));
  gap: 8px;
}
/* Second control column: resolution and orientation continue under the first,
   so the four sliders and selects form one left-hand stack. */
section.split .col-ctl + .col-tiles + .col-ctl {
  grid-column: 1;
}
@media (max-width: 720px) {
  section.split {
    grid-template-columns: minmax(0, 1fr);
  }
  section.split .col-tiles,
  section.split .col-ctl + .col-tiles + .col-ctl {
    grid-column: 1;
    grid-row: auto;
  }
}
/* Inside the split the track gets the whole column, so the earlier 340px cap
   would fight the layout instead of helping it. */
section.split input[type='range'] {
  max-width: none;
}

.row .val {
  flex: 0 0 auto;
}
/* The message under the stream controls gets its own line so the sentence is
   readable. It was a `<span class="dim">` inside the button row, and `dim` is
   a colour class, so the span had no width of its own and ellipsised at the
   edge of the flex row: "Przeglądarka zablokowała nowe ..." on the phone.
   `flex-basis: 100%` takes it out of that row entirely; the block display lets
   it wrap at word boundaries instead of being cut. */
.streammsg {
  display: block;
  flex-basis: 100%;
  font-size: 12px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
/* Dłuższe polskie etykiety nie mieszczą się w wąskim przycisku obok
     "Nagrywaj po ruchu", a "overflow:hidden" ucinałby tekst w połowie słowa.
     Wolno zawijać niż obciąć. */
button,
.btn {
  line-height: 1.25;
  white-space: normal;
  overflow-wrap: anywhere;
}
label {
  display: block;
  font-size: 12px;
  color: var(--dim);
  margin: 10px 0 5px;
}
select,
input[type='text'],
input[type='password'],
input[type='number'] {
  width: 100%;
  background: #0d1117;
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 13px;
  font-family: inherit;
}
/* the slider: THE WHITE BALL. There is exactly one <input type="range"> on
   this page and before this rule the CSS never mentioned appearance at all, so
   Chrome painted its own thumb: a white round knob with a drop shadow, the
   brightest thing on a dark page. It got prominent rather than appearing when
   0de6279 gave .ctl height:36px, which stretched the short input to 36px and
   pushed that default knob outside the track it belonged to. It was never a new
   element, it was an unstyled one.

   The fix has to be all four parts. appearance:none alone removes the UA thumb
   and leaves nothing to grab; a styled thumb with no appearance:none is
   ignored; and Firefox needs ::-moz-range-thumb, which does not accept
   -webkit-appearance:none, so both engines are covered. Colours come from the
   existing palette only: the track is --line, the thumb is --acc with a --bg
   ring so it reads on both. */
input[type='range'] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  margin: 0;
  background: transparent;
  accent-color: var(--acc);
  cursor: pointer;
}
input[type='range']::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  border: 1px solid #21262d;
}
input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--acc);
  border: 2px solid #0d1117;
  box-shadow: 0 0 0 1px var(--acc);
}
input[type='range']:focus-visible::-webkit-slider-thumb {
  box-shadow:
    0 0 0 2px var(--acc),
    0 0 0 4px rgba(76, 175, 80, 0.35);
}
input[type='range']::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  border: 1px solid #21262d;
}
input[type='range']::-moz-range-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--acc);
}
input[type='range']::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--acc);
  border: 2px solid #0d1117;
  box-shadow: 0 0 0 1px var(--acc);
}
/* the codec radio: A SECOND WHITE BALL, same defect as the slider thumb. These
   six <input type="radio"> kept appearance:auto, so Chrome painted its own
   control, a white filled circle for the selected codec, on a dark card. Same
   fix as the slider, minus the track: a ring in --line with a --acc dot when it
   is checked. */
input[type='radio'] {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: #0d1117;
  cursor: pointer;
  display: inline-grid;
  place-content: center;
}
input[type='radio']::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--acc);
  transform: scale(0);
  transition: 0.15s;
}
input[type='radio']:checked {
  border-color: var(--acc);
}
input[type='radio']:checked::before {
  transform: scale(1);
}
input[type='radio']:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
/* select, sized to its content. The three dropdowns (orientation, effect,
   quality) carried class="ctl", and `select` had width:100%, so each one
   stretched the full width of the row and then had to fight .row .ctl
   {flex:1 1 120px} for it. The user read that as an oversized dropdown. A
   select already sizes itself from its widest option, so the fix is to stop
   overriding that: width:auto, the same 32px height as the neighbouring
   controls, and a cap so a long option list cannot push the row past the
   viewport.
   The first selector is ".row select.ctl" and not "select.ctl" on purpose:
   .row .ctl is two classes, so a bare select.ctl loses to it on flex and
   display and the dropdown stays full width. */
.row select.ctl,
select.ctl {
  width: auto;
  max-width: 100%;
  flex: 0 1 auto;
  display: block;
  align-items: baseline;
  gap: 0;
  height: 32px;
  padding: 0 8px;
  font-size: 13px;
  border-radius: 8px;
  /* Centred text. A select's own padding is asymmetric on Android -- the arrow
     is drawn inside the box on the right -- so the option text sits visibly
     left of centre even when the box itself measures correct. `padding-inline`
     equalises the space the arrow takes, and `text-align` with
     `text-align-last` centres what remains, which is the only pair that centres
     a closed select rather than just its options. The user read the off-centre
     text as an unaligned dropdown. */
  padding-inline: 26px;
  text-align: center;
  text-align-last: center;
}
select.ctl:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 1px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th,
td {
  text-align: left;
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
}
th {
  color: var(--dim);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
}
td.num {
  text-align: right;
  font-family: ui-monospace, monospace;
}
/* Overflow, in two places. minmax(0,…) keeps a long value from widening the
     track past the card (a bare 1fr floor is min-content, i.e. the whole
     string), and overflow-wrap:anywhere gives a Wi-Fi name, a storage path or
     an error message somewhere to break. Values are right-aligned, so
     word-break:break-word keeps a single long token from spilling left out of
     the cell as well as down past it. */
.kv {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr);
  gap: 6px 14px;
  font-size: 12px;
}
.kv dt {
  color: var(--dim);
  min-width: 0;
  overflow-wrap: anywhere;
}
.kv dd {
  font-family: ui-monospace, monospace;
  text-align: right;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
code {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  background: #0d1117;
  padding: 1px 5px;
  border-radius: 4px;
  color: #79c0ff;
}
.hint {
  font-size: 11px;
  color: var(--dim);
  margin-top: 6px;
}
.rec {
  color: var(--warn);
  font-weight: 600;
}

/* Clip grid. Thumbnails are <video preload=metadata> rather than <img>
     because a clip's first frame is inside the first mdat, not in the init
     segment — there is no separate poster image to point an <img> at. */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}
.tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.tile:hover {
  border-color: var(--acc);
}
.tile video {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  display: block;
  object-fit: cover;
}
.tile .meta {
  padding: 7px 9px;
  font-size: 11px;
  color: var(--dim);
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: center;
}
.tile .name {
  color: var(--txt);
  font-family: ui-monospace, monospace;
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tile .recDot {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--danger);
  animation: pulse 1.1s infinite;
}
@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.tile input[type='checkbox'] {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 17px;
  height: 17px;
  z-index: 2;
}
.btn {
  display: inline-block;
  background: #21262d;
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  font-family: inherit;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}
.modalBox {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  max-width: 900px;
  width: 100%;
  max-height: 92vh;
  overflow: auto;
}
.modalBox video {
  width: 100%;
  max-height: 70vh;
  background: #000;
  border-radius: 8px;
}
.modalBox h3 {
  font-size: 13px;
  margin: 0 0 10px;
  font-family: ui-monospace, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stream .badge {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 3;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  color: var(--txt);
}
footer {
  text-align: center;
  color: var(--dim);
  font-size: 11px;
  padding: 20px;
}
@media (max-width: 520px) {
  .row > * {
    min-width: 64px;
  }
  button {
    padding: 11px 8px;
    font-size: 12px;
  }
}

/* live audio: the speaker toggle and its state line sit under the picture.
   The <audio> element itself is never displayed -- it is a stream source, not
   a player, and giving it a visible control would put a second, browser-drawn
   transport next to the app's own. `display:none` on a media element that is
   actually playing is safe; it is the *element* that is hidden, not the audio
   pipeline, and every engine keeps decoding a display:none media element. */
.audio-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: -4px 0 16px;
}
.audio-row audio {
  display: none;
}
.audio-row .tgl {
  flex: 0 0 auto;
  /* The toggle had no style rule at all: only .audio-row .tgl existed, with
     `flex: 0 0 auto` and nothing else. The button rendered with the UA default
     chrome and an empty body, so what the user saw was an unlabelled control
     next to the audio line, and the speaker glyph that was supposed to be
     inside it was not in the markup at all. A toggle that reads as broken is
     worse than no toggle, so it gets the same box as .streamctl .ico plus the
     on/off states, and the glyph comes from the markup rather than from
     generated content, so it is announced by the accessibility tree too. */
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(13, 17, 23, 0.72);
  color: var(--fg);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.audio-row .tgl.on {
  background: rgba(34, 197, 94, 0.18);
  border-color: var(--acc);
  color: var(--acc);
}
.audio-row .tgl:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.audio-row .tgl:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

/* Buttons on the picture. Absolutely positioned inside .stream (which is
   position:relative) so they overlay the video instead of taking layout space
   away from it -- a control row under the stream would push the picture down
   and change its aspect box every time it appeared.
   The row sits bottom-left over the image, and pointer-events:none on the row
   with it re-enabled per button keeps clicks that miss a button from being
   swallowed by an invisible overlay sitting on top of the video. */
.streamctl {
  position: absolute;
  left: 10px;
  bottom: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  z-index: 2;
}
.streamctl .ico {
  pointer-events: auto;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(13, 17, 23, 0.72);
  color: var(--fg);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(6px);
  /* Without these three the glyph rides the text baseline and sits visibly low
     and left of centre in its 34px box. The glyph is a single character in a
     <span>, not an SVG, so it has to be laid out as a centred flex box rather
     than centred by its own metrics. */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.streamctl .ico:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
.streamctl .ico:hover:not(:disabled) {
  background: rgba(13, 17, 23, 0.92);
  border-color: var(--acc);
}
.streamctl .ico:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
.streamctl .ico:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.streamctl .dim {
  pointer-events: none;
  margin: 0 0 0 4px;
  max-width: 52%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* In real fullscreen the browser's own Esc exits, so the buttons stay where
   they are; nothing else has to move. */
.stream:fullscreen {
  background: #000;
  border-radius: 0;
  border: 0;
}
.stream:fullscreen img,
.stream:fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Screen-reader-only label. The button glyphs (⛶ ▶ ♪) carry the meaning to a
   sighted user and nothing at all to a screen reader, and the i18n gate counts
   every DOM text node -- which is how it caught that the glyphs were the only
   text in the control. Putting the translated word here gives the control a
   real accessible name, and it is what makes the glyph decoration rather than
   the label. clip-path rather than display:none, because display:none removes
   the element from the accessibility tree, which would defeat the purpose. */
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
/* the icon tile. One button language for optics, security, audio and
   recording: an icon, a small caption UNDER it, and an equal-width cell. The
   complaint from the phone was three separate things with one cause, the
   buttons were wide text pills of different lengths, "Latarka", "Autofokus",
   "Odwróć kamery", so their edges did not line up and neither did their
   captions. A grid of equal columns with the icon over the caption makes the
   whole row share one rhythm whatever the label says, in Polish or English.

   The caption is var(--dim), never dimmer: --dim on --panel is about 5.5:1,
   which reads. What makes it quiet is its size and line-height, not its
   colour. min-height rather than height, so a caption that needs two lines
   grows its tile and the grid row stretches every other tile to match rather
   than leaving one short one. */
.tiles {
  display: grid;
  /* Three equal tracks, sized to the widest caption they must hold.
   *
   * HISTORY, because this rule has been wrong three times in one session and the
   * measurement that catches it is easy to skip:
   *
   *   1. `1fr` -> every tile got the card's full share. Two tiles rendered 182px
   *      wide to hold a 67px caption. The user called them "nadmierne, szerokie".
   *   2. `auto-fit` + `fit-content` -> an empty track collapsed and the row kept
   *      ONE track sized to the first tile, so all three optics tiles became 58px
   *      and "Autofocus" (50px caption) no longer fit.
   *   3. `auto-fill` + `minmax(84px, fit-content(112px))` -> measured 84..112px per
   *      tile, which looked right. It was not: `fit-content()` used as a
   *      minmax() growth limit is a function-valued maximum that auto-fill cannot
   *      distribute, so the grid resolved to a SINGLE track. Measured at 412px:
   *      `getComputedStyle(grid).gridTemplateColumns` === "84px", three tiles at
   *      x=21 with y=596, 648, 700 — one column, 84px used of 370px, 286px and
   *      77% of the row wasted. At 768px, 88% wasted. Every width check passed
   *      because all of them read the tile and none asked where the tile sat.
   *
   * FIX: `repeat(3, minmax(84px, max-content))`. `max-content` is a real track
   * size the grid can resolve and lay out against, three tracks exist regardless
   * of viewport, and the row does not stretch to the card because the tracks are
   * content-sized. The 84px floor keeps a short caption from collapsing the
   * track below a comfortable tap target, and .tilebtn sets min-width: 84px to
   * match.
   *
   * Measured after this change: `gridTemplateColumns` reads "84px 84px 84px" and
   * the three optics tiles sit at x=21, 111, 201 on ONE row (y=568). Before it
   * read a single "84px" with the tiles at x=21, y=596/648/700. Wasted width on
   * the right fell from 286px (77%) to 106px (29%) at 412px.
   *
   * The tracks do not yet grow to the widest caption ("Motion detect" is 67px,
   * "Sound in the browser" is 96px, and all tiles stay at 84/104px), because
   * `max-content` resolves against the tile's own min-width rather than its
   * caption. Equal tracks at a fixed 84px are the better outcome for a scan of
   * icons with short captions, so this is left as measured rather than tuned
   * further: what the user complained about was a 119-182px pill, not an 84px
   * square.
   *
   * THE CHECK THAT MATTERS: count distinct x and y positions. `rows x cols` from
   * bounding boxes, not tile widths. A one-column stack of correctly-sized tiles
   * passes every width assertion. */
  grid-template-columns: repeat(3, minmax(84px, max-content));
  justify-content: start;
  gap: 6px;
}
/* Rows holding fewer tiles than the three the base rule lays out.
 *
 * `repeat(3, ...)` is right for optics (3 tiles) and wrong for every row with
 * less: security has 2, so its third track is empty and 266px of a 370px row go
 * unused (72% wasted, measured); the two solo rows — the audio toggle and the
 * recorder — keep a fixed 104px column inside the same 370px (266px wasted). The
 * screenshot reads as "wide pills with empty space beside them" for exactly this
 * reason: the tiles are the right size and the ROW is wrong.
 *
 * `.tiles.cols-2` / `.tiles.cols-1` are set in src/app.jsx from the tile count, so
 * the track count follows the content instead of being hardcoded per section.
 * Measured after: optics 3 tracks / 84px each, security 2 tracks, both solo rows
 * 1 track at the tile's own width. */
.tiles.cols-2 {
  grid-template-columns: repeat(2, minmax(84px, max-content));
}
.tiles.cols-1 {
  grid-template-columns: minmax(84px, max-content);
}
/* A row holding a single tile. auto-fit with one item still gives the track the
   full card width, so the lone "Dźwięk w przeglądarce" toggle rendered as a
   318px wide pill, which is the oversized button the tiles were meant to end.
   Pinning the column to the tile width is the only thing that changes it. */
.tiles.solo {
  grid-template-columns: 104px;
}
.tilebtn {
  min-height: 46px;
  /* The floor lives on the tile, not on the grid track.
     repeat(auto-fill, minmax(84px, fit-content(112px))) does NOT give 84px:
     when the growth limit is an intrinsic size, Chrome lays the track out at the
     content width and ignores the minimum, which is why English measured
     58/58/58 and 75/75 where Polish measured 87..104. Measured, both languages:
       grid  minmax only -> pl 87..104, en 58..75   (English below the floor)
       flex-wrap        -> pl 45..123, en 35..114    (ragged: "Torch" at 35px)
     A per-tile min-width is honoured in both cases and gives one compact row
     whose tiles never dip below a comfortable tap target. */
  min-width: 84px;
  padding: 4px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
}
.tilebtn svg {
  width: 20px;
  height: 20px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* The caption wraps rather than truncates. An ellipsis here would satisfy
   layout_verify by clipping the text out of its own box, which hides the label
   the icon does not carry: "Odwróć kamery" is two words and one of them is
   the whole meaning. */
.tilebtn .cap {
  font-size: 11px;
  line-height: 1.15;
  color: var(--dim);
  letter-spacing: 0.01em;
  max-width: 100%;
  overflow-wrap: anywhere;
  overflow: visible;
  /* Centred under its icon. Without this the caption hugs the left edge of the
     tile while the icon above it is centred, so the icon and its own label read
     as two unrelated things. `display:block` is needed for the text-align to
     apply to the caption's own line rather than to an inline box. */
  display: block;
  width: 100%;
  text-align: center;
  margin-top: 3px;
}
.tilebtn.on .cap {
  color: var(--acc);
}
.tilebtn:hover:not(:disabled) .cap {
  color: var(--txt);
}
.tilebtn:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}
/* The on-state fill is the existing green, so a running setting is legible
   without a label change. */
.tilebtn.on {
  background: rgba(34, 197, 94, 0.18);
  border-color: var(--acc);
}

</style>

<div id="root"></div>
