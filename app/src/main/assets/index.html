<!DOCTYPE html>
<html lang="en" data-default-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>OcuBea</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--acc:#4CAF50;--warn:#ff5252}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
  header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
  h1{font-size:20px;color:var(--acc);font-weight:700}
  .pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--acc);border-color:var(--acc)}
  .pill.off{color:var(--warn);border-color:var(--warn)}
  main{max-width:860px;margin:0 auto;padding:16px}
  .stream{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .stream img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain}
  .stream .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px}
  /* Shown when HLS was switched off automatically, so the picture that appeared
     is explained rather than looking like the user's own mode change. */
  .stream .badge{position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:999px;
    background:rgba(22,27,34,.82);color:var(--dim);font-size:11px;border:1px solid #30363d}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  /* An action the phone refused. Without it a failed control is indistinguishable
     from one that worked, because most endpoints answer 200 "ok" either way. */
  .flash{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#3d1d1d;
    border:1px solid var(--warn);color:#ffb4b4;font-size:13px}
  .dim{color:var(--dim);font-size:12px;margin-top:8px}
  /* A filename in a list row. truncate + min-width:0 so one long name clips
     instead of stretching the row past the viewport. */
  .row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:ui-monospace,monospace;font-size:12px}
  .row .val{color:var(--dim);font-family:ui-monospace,monospace;font-size:13px}
  .text{flex:1;min-width:0;background:#0d1117;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font:12px ui-monospace,monospace;font-family:inherit}
  /* margin-left:auto, unlike .pill: the pills push the language button right,
     so it must not push itself off the row. */
  .lang{margin-left:auto;padding:4px 10px;font-size:11px;letter-spacing:.06em}
  /* min-width:0: this is a grid item, and a grid/flex child refuses to shrink
     below its content width without it -- a section holding a long value
     widened the whole column instead of clipping. */
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:14px;margin-bottom:12px;min-width:0}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:12px;font-weight:600}
  button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
         font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
  button:hover{background:#30363d}
  button.on{background:#238636;border-color:#2ea043;color:#fff}
  button.primary{background:#238636;border-color:#2ea043;color:#fff}
  button.danger{background:#3d1d1d;border-color:#6e2b2b;color:#ff8a80}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:80px}
  /* Dłuższe polskie etykiety nie mieszczą się w wąskim przycisku obok
     "Nagrywaj po ruchu", a "overflow:hidden" ucinałby tekst w połowie słowa.
     Wolno zawijać niż obciąć. */
  button,.btn{line-height:1.25;white-space:normal;overflow-wrap:anywhere}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
  select,input[type=text],input[type=password],input[type=number]{width:100%;background:#0d1117;color:var(--txt);
         border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit}
  input[type=range]{width:100%;accent-color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
  td.num{text-align:right;font-family:ui-monospace,monospace}
  /* Overflow, in two places. minmax(0,…) keeps a long value from widening the
     track past the card (a bare 1fr floor is min-content, i.e. the whole
     string), and overflow-wrap:anywhere gives a Wi-Fi name, a storage path or
     an error message somewhere to break. Values are right-aligned, so
     word-break:break-word keeps a single long token from spilling left out of
     the cell as well as down past it. */
  .kv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 14px;font-size:12px}
  .kv dt{color:var(--dim);min-width:0;overflow-wrap:anywhere}
  .kv dd{font-family:ui-monospace,monospace;text-align:right;min-width:0;
         overflow-wrap:anywhere;word-break:break-word}
  code{font-family:ui-monospace,monospace;font-size:11px;background:#0d1117;padding:1px 5px;border-radius:4px;color:#79c0ff}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
  .rec{color:var(--warn);font-weight:600}

  /* Clip grid. Thumbnails are <video preload=metadata> rather than <img>
     because a clip's first frame is inside the first mdat, not in the init
     segment — there is no separate poster image to point an <img> at. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        cursor:pointer;position:relative}
  .tile:hover{border-color:var(--acc)}
  .tile video{width:100%;aspect-ratio:16/9;background:#000;display:block;object-fit:cover}
  .tile .meta{padding:7px 9px;font-size:11px;color:var(--dim);display:flex;
              justify-content:space-between;gap:6px;align-items:center}
  .tile .name{color:var(--txt);font-family:ui-monospace,monospace;font-size:10px;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .recDot{position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%;
                background:var(--danger);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .tile input[type=checkbox]{position:absolute;top:8px;right:8px;width:17px;height:17px;z-index:2}
  .btn{display:inline-block;background:#21262d;color:var(--txt);border:1px solid var(--line);
       border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;
         justify-content:center;z-index:50;padding:16px}
  .modalBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
            padding:14px;max-width:900px;width:100%;max-height:92vh;overflow:auto}
  .modalBox video{width:100%;max-height:70vh;background:#000;border-radius:8px}
  .modalBox h3{font-size:13px;margin:0 0 10px;font-family:ui-monospace,monospace;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stream .badge{position:absolute;top:10px;left:10px;z-index:3;background:rgba(0,0,0,.6);
         border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--txt)}
  footer{text-align:center;color:var(--dim);font-size:11px;padding:20px}
  @media(max-width:520px){.row>*{min-width:64px}button{padding:11px 8px;font-size:12px}}

</style>
</head>
