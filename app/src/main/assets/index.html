<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>OcuBea</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--edge:#30363d;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:12px;max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 14px}
h1{font-size:20px;font-weight:600}h1 span{color:var(--acc)}
.badge{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--err);color:var(--err)}
.badge.on{border-color:var(--ok);color:var(--ok)}
#view{background:#000;border:1px solid var(--edge);border-radius:10px;width:100%;aspect-ratio:16/9;display:block;object-fit:contain}
.controls{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
button{background:var(--card);color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--acc)}button.primary{background:#1f6feb;border-color:#1f6feb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:14px}
.card h2{font-size:13px;text-transform:uppercase;color:var(--dim);letter-spacing:.5px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.row .val{color:var(--dim);font-family:monospace}
select,input[type=range]{accent-color:var(--acc);background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:6px;padding:4px 8px}
.switch{position:relative;width:40px;height:22px}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--edge);border-radius:22px;cursor:pointer;transition:.15s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:var(--fg);border-radius:50%;transition:.15s}
input:checked+.slider{background:var(--ok)}input:checked+.slider:before{transform:translateX(18px)}
#recList{font-size:13px;color:var(--dim)}#recList a{color:var(--acc);text-decoration:none;display:block;padding:3px 0}
footer{margin-top:18px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Ocu<span>Bea</span></h1>
  <span class="badge" id="badge">OFFLINE</span>
</header>

<img id="view" src="/shot.jpg" alt="preview">

<div class="controls">
  <button class="primary" id="btnStream">▶ Start view</button>
  <button id="btnSnap">📷 Snapshot</button>
  <button id="btnTorch">🔦 Torch</button>
  <button id="btnFlip">🔄 Flip cam</button>
</div>

<div class="grid">
  <div class="card">
    <h2>Video</h2>
    <div class="row"><span>Quality</span>
      <select id="quality"><option value="320">320p</option><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select></div>
    <div class="row"><span>Effect</span>
      <select id="effect"><option value="none">None</option><option value="mono">Mono</option><option value="negative">Negative</option><option value="sepia">Sepia</option><option value="nightvision">Night vision</option></select></div>
    <div class="row"><span>Zoom <small id="zoomVal">1.0x</small></span>
      <input type="range" id="zoom" min="1" max="8" step="0.5" value="1"></div>
  </div>

  <div class="card">
    <h2>Security camera</h2>
    <div class="row"><span>Motion detection</span><label class="switch"><input type="checkbox" id="motion"><span class="slider"></span></label></div>
    <div class="row"><span>Sensitivity</span><input type="range" id="sens" min="1" max="100" value="50"></div>
    <div class="row"><span>Record on motion</span><label class="switch"><input type="checkbox" id="recording"><span class="slider"></span></label></div>
    <div class="row"><span>Status</span><span class="val" id="motionStatus">idle</span></div>
  </div>

  <div class="card">
    <h2>Audio</h2>
    <div class="row"><span>Listen</span><audio controls preload="none" style="width:100%" src="/audio.wav"></audio></div>
    <div class="row"><span>Clients</span><span class="val" id="audioClients">0</span></div>
  </div>

  <div class="card">
    <h2>Recordings (<span id="recCount">0</span>)</h2>
    <div id="recList">loading…</div>
  </div>

  <div class="card">
    <h2>Info</h2>
    <div class="row"><span>FPS / Viewers</span><span class="val" id="fpsViewers">–</span></div>
    <div class="row"><span>Resolution</span><span class="val" id="res">–</span></div>
    <div class="row"><span>Battery</span><span class="val" id="battery">–</span></div>
    <div class="row"><span>ONVIF</span><span class="val">Profile S @ :3702</span></div>
  </div>
</div>

<footer>OcuBea — open IP webcam · API at <a style="color:var(--acc)" href="/status.json">/status.json</a></footer>

<script>
"use strict";
var streaming=false;
function $(id){return document.getElementById(id)}

function set(name,val,cb){
  fetch('/settings/'+name+'?set='+encodeURIComponent(val),{method:'POST'})
    .then(function(r){if(cb)cb(r.ok)});
}

$('btnStream').onclick=function(){
  if(streaming){$('view').src='/shot.jpg';this.textContent='▶ Start view';streaming=false;}
  else{$('view').src='/video';this.textContent='⏸ Stop view';streaming=true;}
};

$('btnSnap').onclick=function(){window.open('/shot.jpg','_blank')};
$('btnTorch').onclick=function(){
  var on=this.dataset.on!=='1';
  this.dataset.on=on?'1':'0';
  fetch(on?'/torchon':'/torchoff',{method:'POST'});
};
$('btnFlip').onclick=function(){fetch('/settings/ffc?set=toggle',{method:'POST'}).then(refreshStatus)};

$('quality').onchange=function(){set('quality',this.value)};
$('effect').onchange=function(){set('effect',this.value)};
$('motion').onchange=function(){set('motion_detection',this.checked?'on':'off')};
$('recording').onchange=function(){set('recording',this.checked?'on':'off')};
$('sens').onchange=function(){set('motion_sensitivity',this.value)};
var zoomT;$('zoom').oninput=function(){
  $('zoomVal').textContent=(+this.value).toFixed(1)+'x';
  clearTimeout(zoomT);var v=this.value;
  zoomT=setTimeout(function(){fetch('/ptz?zoom='+v,{method:'POST'})},200);
};

function refreshStatus(){
  fetch('/status.json').then(function(r){return r.json()}).then(function(s){
    $('badge').textContent=s.camera_active?'LIVE':'OFFLINE';
    $('badge').className='badge'+(s.camera_active?' on':'');
    $('fpsViewers').textContent=s.fps+' fps · '+s.viewers+' viewer(s)';
    $('res').textContent=s.resolution;
    $('battery').textContent=s.battery_level>=0?s.battery_level+'%':'n/a';
    $('audioClients').textContent=s.audio_clients;
    $('motionStatus').textContent=s.motion.detected?'⚠ MOTION':(s.recording.active?'● recording':'idle');
    if(!$('motion').matches(':focus')) $('motion').checked=s.motion.enabled;
    $('recording').checked=s.recording.enabled;
    $('recCount').textContent=s.recording.count;
  }).catch(function(){});
}
function refreshRecs(){
  fetch('/recordings').then(function(r){return r.json()}).then(function(d){
    var el=$('recList');
    if(!d.recordings.length){el.textContent='no recordings yet';return}
    el.innerHTML='';
    d.recordings.forEach(function(f){
      var a=document.createElement('a');
      a.href='/recordings/'+f.name;a.textContent='🎬 '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)';
      a.download=f.name;el.appendChild(a);
    });
  }).catch(function(){});
}

refreshStatus();refreshRecs();
setInterval(refreshStatus,3000);
setInterval(refreshRecs,15000);
// auto-recover stream if it drops
setInterval(function(){
  if(streaming&&$('view').naturalWidth===0){$('view').src='/video'}
},5000);
</script>
</body>
</html>
