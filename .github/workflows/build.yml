name: Build OcuBea APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit tests run before the build so a broken encoder or muxing change
      # fails here rather than in a downloaded APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Lint is here because minSdk is 23 and the app has to run on Android 6.
      # An API introduced after 23 throws NoSuchMethodError on that device, and
      # compileSdk 34 resolves the symbol so the build stays green. This found
      # four such calls that had shipped: isHardwareAccelerated (API 29),
      # computeIfAbsent (API 24), updateAndGet (API 24) and withInitial (API 26).
      # abortOnError is set in build.gradle.kts, so this step fails the job.
      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # The release build exists to prove R8 kept the classes that are reached by
      # name rather than by call -- MediaCodec, ViewBinding, the service and boot
      # receiver, the enum values reported in /status.json. Those classes are
      # absent from the debug build, so assembleDebug passing says nothing about
      # them. The failure mode is silent: the app starts, serves /video, and the
      # encoder lookup fails only when a client asks for audio.
      #
      # Unsigned on purpose. Release signing needs a key this workflow must not
      # have, and a keystore in CI would be worse than none.
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned release that assembles is the whole check. Reading the
      # classes.dex for a kept class would be a stronger check, but R8 already
      # fails the build on missing classes it cannot resolve, and what it cannot
      # see by name is exactly what was verified by installing the signed
      # release on a device.
      - name: Confirm the release APK exists
        run: |
          ls -la app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      # The restore guard in the mutation harness deleted work twice while
      # reporting that the source was verified, and its own log was reassuring in
      # both cases. It is cheap, it touches no Gradle state, and it is the only
      # thing that keeps the harness honest about which writes were its own -- so
      # it runs on every build rather than when someone remembers.
      #
      # No python step existed in this workflow before, so the interpreter is
      # pinned rather than assumed from the runner image. Nothing here needs a
      # third-party package -- stdlib only, deliberately, because a gate that
      # can fail on a missing pip install is a gate that gets skipped.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the mutation harness restore guard
        run: python3 tools/verify_restore_guard.py

      # check_mjpeg.py is the tool that tells "the camera sent nothing" apart from
      # "the consumer wrote nothing", so it is trusted precisely when something is
      # wrong. It could not be trusted at all: main() returned 0 unconditionally,
      # so a 100x garbage buffer, an empty file and a nonexistent path all
      # exited 0 while printing accurate verdicts. A correct verdict that cannot
      # turn a build red reads as one that was acted on.
      #
      # It now exits 1 on an unusable stream and 2 on a usage error, and rejects
      # frames that disagree on size -- a stream that renegotiated mid-capture, or
      # one that spliced two sources, is not one a consumer can size buffers for.
      #
      # Verified here because the only other way to find out is a broken camera.
      - name: Verify the MJPEG gate can fail
        run: python3 tools/verify_mjpeg_gate.py

      # onvif_verify.py is the only check that answers "would a real NVR accept
      # this camera", and it needs a phone, so CI cannot run it. Without this it
      # is 14 checks whose own correctness nobody knows until the device stops
      # behaving like an ONVIF service -- which is discovered by an NVR showing
      # "no response from device".
      #
      # Two servers stand in. The first faults every operation, which anything
      # fails. The second is the one that matters: a decoy answering with
      # well-formed envelopes containing every string a grep-based probe looks
      # for -- operation names, the profile token, the encoder configuration, a
      # stream URI -- while being useless to an NVR. Measured, it collects 6 of
      # 15 checks as PASS and still exits 1.
      #
      # That second server is the whole test. A probe that passes a decoy is not
      # a weak probe, it is a probe that would certify anything.
      - name: Verify the ONVIF gate rejects a fake device
        run: python3 tools/verify_onvif_gate.py

      # rtsp_verify.py walks RTSP as a player does and checks the bytes that come
      # back, which is the only way to catch the failure this app has already had:
      # OPTIONS, DESCRIBE, SETUP and PLAY all answer 200, the SDP announces a
      # track, and not one byte of RTP is ever sent. Status codes say the camera
      # works. The NVR shows a stream that connects and then shows nothing.
      #
      # The decoy here does exactly that and is rejected: 7 checks failing, exit 1,
      # while 5 pass because it genuinely does speak RTSP 1.0. The verdict comes
      # from the payload checks, not from a connection having succeeded.
      #
      # Also pinned, because it cost a false green while writing it: the probe
      # takes host and port as separate arguments. Handed a full URL it reads port
      # 8554 regardless, finds nothing listening there, declares RTSP off and
      # exits 0 with one check passed -- a green result about a port nobody asked
      # about.
      - name: Verify the RTSP gate rejects a silent server
        run: python3 tools/verify_rtsp_gate.py

      # The decode gate is the only check that asks a decoder instead of asking
      # the server whether it is talking to itself. It was inline in
      # rtsp_capture_h264.py, which meant the only way to learn whether it could
      # tell a broken capture from a clean one was to produce a broken capture --
      # and the capture tool is what has been broken before.
      #
      # tools/decode_gate.py is that logic on its own, so it runs against a saved
      # file. This verifies it by construction: ffmpeg encodes a real stream, and
      # bytes are cut out of it at chosen points, which is what a dropped FU-A
      # fragment looks like from outside anyway. The decoder still emits a frame
      # for a damaged one, so nb_read_frames stays green -- which is the whole
      # reason the gate counts decoder errors rather than frames.
      #
      # The threshold is measured, not asserted, and it separates: 0.00 clean,
      # 0.10 and 0.25 for one and three holes, 0.61 to 1.05 from eight upward.
      # Real phone captures read 0.00-0.03 healthy and 1.59-2.14 damaged, so the
      # limit of 0.5 sits in the gap rather than at zero, which no file reaches.
      #
      # Two earlier versions of this test were wrong and both were the test's
      # fault. One built slices from a repeating byte pattern, which is not video:
      # ffmpeg said "A non-intra slice in an IDR NAL unit" and both the clean and
      # the damaged case decoded zero frames. The other punched one hole into one
      # frame out of twelve and expected a failure -- that is 8% of the picture
      # damaged, and the gate correctly read 0.33 and passed.
      #
      # A third asked ffmpeg for an IDR so the test could run without a phone. It
      # will not emit one -- -g 1, -qp 0, -force_key_frames and all-intra=1 all
      # still give NAL type 1 -- and splitting its output by type reported a PPS of
      # 8239 bytes, which was the test's own parser being wrong about where NALs
      # start. The current version needs no IDR and parses no NALs at all, so it
      # runs identically here and on the machine that took the capture.
      # ffmpeg is installed here rather than assumed. The verify script exits 1
      # with "brak ffmpeg" when it is missing, which is correct for a check and
      # useless for a build: it would turn a missing package into a red X that
      # reads like a broken stream. So the install is explicit and the script's
      # own guard stays as the honest failure.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Verify the decode gate measures a damaged stream
        run: python3 tools/verify_decode_gate.py

      # mutate_ramp_guard.py is the harness that taught this repo what a mutation
      # gate owes its reader: it forces --rerun-tasks after Gradle served a mutated
      # source from cache, made a compile failure INCONCLUSIVE, and restores in a
      # finally block after leaving mutated production code behind once. Every other
      # gate here calls itself honest on this file's word, so its three guarantees
      # are checked rather than read.
      #
      # Needs no phone and no Gradle build. The canaries were run against five
      # weakened copies of the harness -- --rerun-tasks removed, finally turned into
      # a dead branch, the Sentinel accepting every file, a compile error counted
      # as caught, and the 'e: ' detector stubbed to False -- and the gate went red
      # on all five.
      - name: Verify the mutation harness enforces its own guards
        run: python3 tools/verify_ramp_guard_gate.py

      # The capture tool went green in CI while being broken. It called
      # decode_gate.passes with no import for it, so every real run died with a
      # NameError on the last step, after the minutes spent talking to the camera.
      # Committed as 4afe530, and the decode gate suite did not notice because it
      # tests decode_gate.py and never touches the file that calls it.
      #
      # Import checking would not have caught it either, and that was measured
      # rather than assumed: importing the committed file succeeds with or without
      # the import, because the name resolves only when main() runs and importing
      # a module executes none of its body. So this calls what main() calls and
      # requires a verdict instead of an exception.
      #
      # Confirmed by running it against the committed version: red with "capture
      # does not have decode_gate", green after the one-line fix.
      - name: Verify the capture tool can reach every gate it runs
        run: python3 tools/verify_capture_gate.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci, not npm install. Three of the WebUI gates load playwright from
      # node_modules and playwright was never in package.json -- it was installed
      # here with --no-save, which npm documents as "do not save to
      # package.json", so the dependency lived only in this workflow file and in
      # whatever node_modules happened to exist locally. package-lock.json did
      # not mention it either: 117 packages, no playwright, no prettier.
      #
      # That works right up until someone runs npm ci locally, which deletes
      # node_modules and reinstalls from the lockfile. Measured: npm ci left all
      # three gates failing on MODULE_NOT_FOUND while prettier, eslint and the
      # string check still passed, so it looked like three broken tests rather
      # than an undeclared dependency.
      #
      # playwright is pinned exactly here for the same reason prettier is: a range
      # resolves differently over time and the browser revision it wants moves
      # with it, which turns "the gate fails" into "the gate fails next month".
      - name: Install Node dependencies
        run: npm ci
        env:
          NODE_ENV: development

      # Separate step on purpose. npm ci installs the playwright package, which
      # downloads nothing: the browser is a separate ~150MB download that lands
      # outside node_modules. Put in one step, this reads as one action and gets
      # collapsed into a single line that skips the browser step.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Before every gate that renders the WebUI, because they all read the
      # built bundle rather than src/. Gradle does not build it -- nothing in
      # app/build.gradle.kts invokes node or build.mjs -- so it is committed, and
      # nothing checked that it still matched its source.
      #
      # Measured: the committed bundle was last rebuilt at 5b1c2fc, and src/ has
      # gained 1452 lines since. All three browser gates were green throughout,
      # testing a bundle that no longer corresponded to the code. The APK built
      # at 18:57 shipped buildId d7fa31ed while src/ was at 2d2a0850, so the
      # phone was running the old UI and CI was congratulating it.
      #
      # A gate that only inspects an artefact cannot tell a stale artefact from a
      # correct one. This rebuilds and compares bytes, so the answer does not
      # depend on remembering to run a build.
      - name: Verify the WebUI bundle matches src
        run: node tools/bundle_verify.js

      - name: Check Polish strings are complete
        run: node tools/strings_verify.js

      - name: Check WebUI is fully translated
        run: node tools/i18n_verify.js

      - name: Check WebUI labels fit
        run: node tools/layout_verify.js

      - name: Check WebUI labels keep their language
        run: node tools/interaction_verify.js

      # no-undef, and specifically for this: app.jsx once called
      # deleteAllRecordings / pruneClips / clearClips without importing them.
      # esbuild passes undefined names straight through, so the bundle built,
      # the buttons rendered, the clicks did nothing and the console stayed
      # clean -- three dead controls that looked alive. A bundler cannot catch
      # that; this can.
      - name: Lint WebUI sources
        run: npx eslint src/

      # Prettier is the WebUI's formatter, and it is a gate rather than a
      # convenience because a reformat that nobody asked for is how a diff stops
      # being readable: with no formatter enforced, every unrelated pull request
      # grows a formatting diff nobody can review, and the real change drowns in
      # it. It runs after eslint because eslint is the check that finds bugs
      # (no-undef caught three dead buttons) and this one only finds style.
      #
      # --check, not --write. A CI job that fixes the code it is checking has
      # verified nothing; the working tree stays clean and the job fails.
      #
      # exit code 2 means a parse error, not a style difference, so it is treated
      # as a failure too rather than passing quietly.
      - name: Check WebUI formatting
        run: npm run format:check

      # Kotlin lint, gated on defect rules only.
      #
      # ktlint reports 1510 findings here and every one of them is a layout
      # opinion: 337 argument-list-wrapping, 268 indent, 263 statement-wrapping.
      # Gating on those is not a quality gate, it is a gate that can only be
      # satisfied by reformatting 109 files, which buries whatever change is
      # under review and gets reverted by the next person who disagrees with a
      # line break. That reformat was tried, measured at 109 files and
      # idempotent, and reverted.
      #
      # So tools/ktlint_gate.py filters ktlint's output down to the rules that
      # name something actually wrong: unused and duplicated imports, import
      # order, a missing final newline, padded braces in a template, consecutive
      # blank lines. That was 77 real findings and all 77 are fixed.
      #
      # An earlier attempt put this filter in .editorconfig as
      # ktlint_standard_<rule> = disabled. ktlint 1.x has no such key: it is not
      # in the 1.5.0 jar, not in 1.3.1, and four spelling variants changed
      # nothing. The gate is a wrapper for that reason, and it fails with exit 2
      # if ktlint itself cannot run -- a checker that reads "ktlint crashed" as
      # "no findings" is worse than no checker.
      #
      # Verified by tools/verify_ktlint_gate.py, which runs here too: six
      # mutations of a real source file, each of which must turn the gate red
      # and is confirmed to name the rule it claims, plus the crash case. 7/7.
      - name: Lint Kotlin sources
        run: |
          curl -sSL --retry 3 -o /tmp/ktlint \
            https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          # The release asset is a shell wrapper with the jar appended after it.
          # Find the zip header rather than hardcoding the offset: 477 works for
          # both 1.3.1 and 1.5.0 today and silently produces a corrupt jar the day
          # the wrapper changes.
          python3 -c "
          raw = open('/tmp/ktlint','rb').read()
          off = raw.find(b'PK\\x03\\x04')
          assert off > 0, 'ktlint asset carries no jar'
          open('/tmp/ktlint.jar','wb').write(raw[off:])
          print(f'jar wyciagniety z offsetu {off}')
          "
          python3 tools/ktlint_gate.py "app/src/**/*.kt" --jar /tmp/ktlint.jar

      - name: Verify the Kotlin lint gate can fail
        run: python3 tools/verify_ktlint_gate.py

      # Needs a running phone, so it is NOT wired into this job: it creates and
      # deletes a clip. Run it against a device with tools/bulk_actions_verify.js
      # -- it is the check that caught the bulk buttons doing nothing.

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcuBea.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OcuBea-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
