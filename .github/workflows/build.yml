name: Build OcuBea APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit tests run before the build so a broken encoder or muxing change
      # fails here rather than in a downloaded APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Lint is here because minSdk is 23 and the app has to run on Android 6.
      # An API introduced after 23 throws NoSuchMethodError on that device, and
      # compileSdk 34 resolves the symbol so the build stays green. This found
      # four such calls that had shipped: isHardwareAccelerated (API 29),
      # computeIfAbsent (API 24), updateAndGet (API 24) and withInitial (API 26).
      # abortOnError is set in build.gradle.kts, so this step fails the job.
      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # The release build exists to prove R8 kept the classes that are reached by
      # name rather than by call -- MediaCodec, ViewBinding, the service and boot
      # receiver, the enum values reported in /status.json. Those classes are
      # absent from the debug build, so assembleDebug passing says nothing about
      # them. The failure mode is silent: the app starts, serves /video, and the
      # encoder lookup fails only when a client asks for audio.
      #
      # Unsigned on purpose. Release signing needs a key this workflow must not
      # have, and a keystore in CI would be worse than none.
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned release that assembles is the whole check. Reading the
      # classes.dex for a kept class would be a stronger check, but R8 already
      # fails the build on missing classes it cannot resolve, and what it cannot
      # see by name is exactly what was verified by installing the signed
      # release on a device.
      - name: Confirm the release APK exists
        run: |
          ls -la app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      # The restore guard in the mutation harness deleted work twice while
      # reporting that the source was verified, and its own log was reassuring in
      # both cases. It is cheap, it touches no Gradle state, and it is the only
      # thing that keeps the harness honest about which writes were its own -- so
      # it runs on every build rather than when someone remembers.
      #
      # No python step existed in this workflow before, so the interpreter is
      # pinned rather than assumed from the runner image. Nothing here needs a
      # third-party package -- stdlib only, deliberately, because a gate that
      # can fail on a missing pip install is a gate that gets skipped.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the mutation harness restore guard
        run: python3 tools/verify_restore_guard.py

      # The WebUI is checked in a real browser because a translation gap, a
      # clipped label or a label that reverts to English after a click is
      # invisible in a JVM test and in a build log. All three checks exit
      # non-zero on failure, so they gate the APK.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Check Polish strings are complete
        run: node tools/strings_verify.js

      - name: Check WebUI is fully translated
        run: node tools/i18n_verify.js

      - name: Check WebUI labels fit
        run: node tools/layout_verify.js

      - name: Check WebUI labels keep their language
        run: node tools/interaction_verify.js

      # no-undef, and specifically for this: app.jsx once called
      # deleteAllRecordings / pruneClips / clearClips without importing them.
      # esbuild passes undefined names straight through, so the bundle built,
      # the buttons rendered, the clicks did nothing and the console stayed
      # clean -- three dead controls that looked alive. A bundler cannot catch
      # that; this can.
      - name: Lint WebUI sources
        run: npx eslint src/

      # Prettier is the WebUI's formatter, and it is a gate rather than a
      # convenience because a reformat that nobody asked for is how a diff stops
      # being readable: with no formatter enforced, every unrelated pull request
      # grows a formatting diff nobody can review, and the real change drowns in
      # it. It runs after eslint because eslint is the check that finds bugs
      # (no-undef caught three dead buttons) and this one only finds style.
      #
      # --check, not --write. A CI job that fixes the code it is checking has
      # verified nothing; the working tree stays clean and the job fails.
      #
      # exit code 2 means a parse error, not a style difference, so it is treated
      # as a failure too rather than passing quietly.
      - name: Check WebUI formatting
        run: npm run format:check

      # Kotlin gets a linter for the same reason, and it is checked at the defect
      # rules only. Full ktlint reports 3673 findings here, of which all but 77 are
      # wrapping and indentation opinions: 782 on function-signature alone. Making
      # the gate pass would mean reformatting 48 unrelated files inside a commit
      # about RTSP, which buries the change instead of reviewing it.
      #
      # So .editorconfig disables the layout rules and keeps the ones that name a
      # defect -- unused and duplicated imports, import order, a missing final
      # newline, redundant curly braces in a template. Those were 77 real findings
      # and all 77 are fixed. The layout rules are off as a deliberate recorded
      # choice, not by accident: they stay available, and turning one on is a
      # separate change with its own reformat.
      #
      # Verified to fail: a duplicated import and an unsorted pair both make this
      # exit 1. A gate never seen red is not a gate.
      - name: Lint Kotlin sources
        run: |
          curl -sSL --retry 3 -o /tmp/ktlint \
            https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x /tmp/ktlint
          /tmp/ktlint "app/src/**/*.kt" --relative

      # The RTSP decoder gate. It needs a live camera, so it is not wired in here
      # -- it runs on a device with tools/rtsp_capture_h264.py, which is the check
      # that proved a stream can be 27/27 on every protocol check and still
      # undecodable. It is listed here so the next person looking for it finds it.

      # Needs a running phone, so it is NOT wired into this job: it creates and
      # deletes a clip. Run it against a device with tools/bulk_actions_verify.js
      # -- it is the check that caught the bulk buttons doing nothing.

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcuBea.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OcuBea-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
