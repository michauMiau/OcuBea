# Automated releases
#
# Nothing here needs a version typed in. Pushing a tag ending in -rc* publishes a
# GitHub Release whose notes are generated from the commit subjects between the
# previous tag and this one, each one a link to the commit that introduced it.
#
# Why the tag and not the push: a release published on every push means one
# release per commit, which is a feed nobody reads and a version number nobody
# can remember. A tag is the one thing that already means "this is a version",
# and it is the thing the GitHub UI and `gh release` both understand. RC rather
# than a bare version because the APK is unsigned unless the four OCUBEA_*
# secrets are set, and an unsigned APK should not claim to be a finished release.
#
# The changelog is built from commit subjects, not from a CHANGELOG.md anyone
# has to remember to update. That file always goes stale and always lies about
# what shipped, because it describes the last time somebody remembered. Commit
# subjects are written anyway, they are already in the repository, and they cannot
# drift from what was actually built.

name: release

on:
  push:
    tags:
      - 'v*-rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Secrets are not in the `secrets` context available to a step-level `if:`,
    # and a workflow that references them there is rejected at parse time -- every
    # run fails in zero seconds before a single step starts, with no log and the
    # workflow name showing as a file path instead of its `name:`.
    env:
      OCUBEA_STORE_B64: ${{ secrets.OCUBEA_STORE_B64 }}
      OCUBEA_STORE_PASS: ${{ secrets.OCUBEA_STORE_PASS }}
      OCUBEA_KEY_ALIAS: ${{ secrets.OCUBEA_KEY_ALIAS }}
      OCUBEA_KEY_PASS: ${{ secrets.OCUBEA_KEY_PASS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The previous tag has to be present or the changelog cannot tell which
          # commits are new, and a shallow clone has no tags at all.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Resolve the tag being published
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A workflow_dispatch on a branch would otherwise publish a release
          # named after the branch, and `github.ref_name` is the branch name in
          # that case. Refusing here is better than publishing something named
          # "main".
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist in this checkout"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

      # Signed when the keystore is available, unsigned otherwise.
      #
      # The condition is on `env`, never on `secrets`: a `secrets` reference in a
      # step `if:` is rejected at parse time and takes the whole workflow down.
      #
      # A signed build is preferred, and an unsigned one is still published, so
      # the release always exists. An APK that is 6.7% long in the audio is a
      # different question -- that is fixed in the source, not here.
      - name: Build signed release APK
        if: ${{ env.OCUBEA_STORE_B64 != '' }}
        run: |
          test -n "$OCUBEA_STORE_B64" || { echo "OCUBEA_STORE_B64 is set but empty"; exit 1; }
          printf '%s' "$OCUBEA_STORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Proved here, where the message can name the keystore, rather than
          # surfacing later as a signing error from Gradle.
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$OCUBEA_STORE_PASS" -alias "$OCUBEA_KEY_ALIAS" >/dev/null
          # Removed even when the build fails, so nothing later in this runner can
          # pick the keystore out of the workspace.
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          ./gradlew assembleRelease --no-daemon \
            -PocubeaStoreFile="$RUNNER_TEMP/release.keystore" \
            -PocubeaStorePass="$OCUBEA_STORE_PASS" \
            -PocubeaKeyAlias="$OCUBEA_KEY_ALIAS" \
            -PocubeaKeyPass="$OCUBEA_KEY_PASS"
          # Gradle drops the -unsigned suffix when it signs. Testing for the
          # unsigned name would pass whether or not signing happened, which is
          # the failure the gradle comment warns about.
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Pick the APK to publish
        id: apk
        run: |
          SIGNED=app/build/outputs/apk/release/app-release.apk
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$SIGNED" ]; then
            echo "path=$SIGNED" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "path=$UNSIGNED" >> "$GITHUB_OUTPUT"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::notice::no signing secrets configured, publishing the unsigned APK"
          fi

      # The notes. Commit subjects between the previous tag and this one, each a
      # link to the commit that introduced it.
      #
      # Written in the run rather than by a marketplace action on purpose: the
      # action would be another thing that can change behaviour when its
      # maintainers push, and the whole mechanism here is one `git log`.
      - name: Build the changelog from commit subjects
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          SHORT="$(git rev-parse --short "$TAG")"
          {
            echo "Android 6 and later. APK is attached."
            echo
            if [ -n "$PREV" ]; then
              RANGE="$PREV..$TAG"
              echo "Commits since [$PREV](https://github.com/${{ github.repository }}/releases/tag/$PREV):"
            else
              RANGE="$TAG"
              echo "All commits in this release:"
            fi
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))' | tac
            echo
            echo
            echo "Build \`$SHORT\` from \`$TAG\`."
          } > "$RUNNER_TEMP/notes.md"
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat "$RUNNER_TEMP/notes.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          # The notes are generated, so re-running on the same tag replaces the
          # release rather than failing on an existing one. A release that cannot
          # be rebuilt is a release that cannot be corrected.
          printf '%s\n' \
            '<!-- generated from commit subjects by release.yml; edit the commits, not this -->' \
            > "$RUNNER_TEMP/notes_final.md"
          cat "$RUNNER_TEMP/notes.md" >> "$RUNNER_TEMP/notes_final.md"
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes_final.md" \
            --clobber

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: OcuBea-release-${{ steps.tag.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}